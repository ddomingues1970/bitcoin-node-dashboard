[package]
name = "bitcoin-node-dashboard"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
axum = "=0.8.4"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tokio = { version = "=1.51.6", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
libc = "=0.2.191"

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }

